name: Verificações

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Chamado pelo release.yml, github.workflow é o nome dele: a fila fica separada e um push novo na main não cancela uma publicação.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tipos, lint e testes de interface não dependem do Rust nem do Windows: rodam no Linux, em paralelo com o backend.
  frontend:
    name: Tipos, lint e testes de interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Migração da telemetria contra um Postgres de verdade (o Ubuntu do GitHub já traz o Postgres). Ver docs/TELEMETRY.md.
      - name: Testes do banco da telemetria
        run: bash supabase/tests/run.sh

  backend:
    name: Build e testes do backend
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Sem informação de depuração, a pasta target e o cache ficam bem menores e o link no Windows é mais rápido.
      # As mensagens de falha dos testes continuam com arquivo e linha.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Prepara o Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      # Guarda só as dependências compiladas (não o código do Prancha) e só na main: os PRs leem o cache da main sem gastar minutos salvando.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            extensions -> ../src-tauri/target/extensions-wasm
          # Muda junto com o opt-level das dependências abaixo, para não reaproveitar dependências compiladas de outro jeito.
          key: deps-opt2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # O Tauri embute o frontend ao compilar: o backend precisa dele pronto. É também o build de produção do frontend.
      - run: npm run build

      # Os testes de detecção (--test guided) e o E2E usam páginas reais, que não vão para o git: rodam localmente, antes de cada versão.
      # As dependências saem otimizadas (o código do Prancha não): em modo debug, o Cranelift do wasmtime compila cada extensão
      # dos testes muito devagar. Só muda a velocidade, não o que é testado; elas ficam no cache e só recompilam quando mudam.
      - name: Testes do backend
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --test backend --test extensions --config 'profile.dev.package."*".opt-level=2'

  # Confere o Client ID do MyAnimeList (variável do repositório MAL_CLIENT_ID) contra a API real: uma pesquisa pública só com
  # ele, sem conta. Fica fora da proteção da main porque depende de um serviço de fora; o build da versão confere de novo.
  # Em PRs de forks a variável não chega, e a verificação é pulada.
  myanimelist:
    name: Client ID do MyAnimeList
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pesquisa na API do MyAnimeList com o Client ID
        env:
          MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
        run: |
          if [ -z "$MAL_CLIENT_ID" ]; then
            echo "::warning::A variável MAL_CLIENT_ID não está disponível aqui: a integração com o MyAnimeList não foi conferida."
            exit 0
          fi
          if ! printf '%s' "$MAL_CLIENT_ID" | grep -Eq '^[A-Za-z0-9]{16,64}$'; then
            echo "::error::A variável MAL_CLIENT_ID não tem o formato de um Client ID do MyAnimeList (letras e números)."
            exit 1
          fi
          # O valor vai só no cabeçalho, nunca na saída. Tenta de novo em falhas de rede e erros 5xx do MAL.
          for attempt in 1 2 3; do
            status="$(curl -sS -o body.json -w '%{http_code}' --max-time 20 -H "X-MAL-CLIENT-ID: $MAL_CLIENT_ID" \
              'https://api.myanimelist.net/v2/manga?q=berserk&limit=1&fields=num_chapters' || echo 000)"
            case "$status" in
              200) break ;;
              000|5*) sleep $((attempt * 10)) ;;
              *) break ;;
            esac
          done
          case "$status" in
            200)
              if ! grep -q '"data"' body.json; then
                echo "::error::O MyAnimeList respondeu sem resultados."
                exit 1
              fi
              echo "O MyAnimeList aceitou o Client ID." ;;
            401|403) echo "::error::O MyAnimeList recusou o Client ID (erro $status). Confira a variável MAL_CLIENT_ID com o cadastro em myanimelist.net/apiconfig."; exit 1 ;;
            *) echo "::error::O MyAnimeList não respondeu como esperado (erro $status)."; exit 1 ;;
          esac

  # Um nome só para a proteção da main: passa apenas quando todas as verificações passam.
  checks:
    name: Tipos, lint, testes e backend
    needs: [frontend, backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confere o resultado das verificações
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::Uma verificação não passou ($result)."
              exit 1
            fi
          done
