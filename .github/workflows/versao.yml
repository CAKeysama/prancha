name: Versão

# Toda mudança na main sai como versão nova. No PR, confere se os commits estão rotulados e se a versão subiu do jeito que eles pedem.
# Na main, avisa se algo entrou sem versão nova, porque isso não é publicado. Ver docs/RELEASING.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: versao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    name: Rótulos e versão do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Confere o título do PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/version.mjs title "$TITLE"

      - name: Confere os commits, a versão e o changelog
        run: node scripts/version.mjs check "origin/$GITHUB_BASE_REF"

  main:
    name: Versão nova na main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/version.mjs released HEAD
