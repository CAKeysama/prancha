name: Publicar versão

# Publica sozinho quando a versão do package.json muda na main, com a entrada no CHANGELOG.md: é o merge da versão nova.
# Uma tag vX.Y.Z enviada à mão também publica. Rodar à mão é um ensaio: compila e guarda os instaladores, sem publicar nada.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # Vale só para a main: o GitHub não avalia `paths` em tags.
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

# O merge cria a tag com a release, e a tag dispara este workflow de novo: a segunda execução espera e vê que já foi publicada.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Conferir a versão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        name: Decide se há versão nova para publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "::notice::Ensaio: os instaladores ficam como artefato da execução e nada é publicado."
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão do projeto ($tag)."
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::notice::A $tag já está publicada."
            else
              publish=true
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::A $tag já existe: a main não tem versão nova."
          else
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  build:
    name: Gerar os instaladores
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Prepara o Rust
        run: rustup toolchain install stable --profile minimal

      # Guarda só as dependências compiladas em release, separadas das dos testes. O código do Prancha sempre é compilado do zero.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # Sem a chave, a compilação falha aqui: nenhuma versão sai sem assinatura. Ver docs/RELEASING.md.
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Reúne os instaladores, as assinaturas e os SHA-256
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir installers
          for file in "src-tauri/target/release/bundle/nsis/Prancha_${version}_x64-setup.exe" "src-tauri/target/release/bundle/msi/Prancha_${version}_x64_pt-BR.msi"; do
            cp "$file" "$file.sig" installers/
          done
          node scripts/updater-manifest.mjs "$version" installers
          cd installers
          for file in *.exe *.msi; do
            # Um instalador de verdade tem vários MB: menos que isso é build quebrado.
            if [ "$(stat -c %s "$file")" -lt 1000000 ]; then
              echo "::error::$file é pequeno demais."
              exit 1
            fi
          done
          sha256sum -b -- *.exe *.msi | sed 's/ \*/  /' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: instaladores
          path: installers
          if-no-files-found: error

  publish:
    name: Publicar a release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: instaladores
          path: installers

      - name: Cria a tag e a release com as notas do changelog
        env:
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          # Com o RELEASE_TOKEN, a release sai na conta dona do token. Sem ele, ou vencido, sai como github-actions[bot].
          export GH_TOKEN="$RELEASE_TOKEN"
          if [ -z "$GH_TOKEN" ] || ! gh api user --silent 2> /dev/null; then
            echo "::warning::Sem um RELEASE_TOKEN válido, a release sai como github-actions[bot]. Ver docs/RELEASING.md."
            export GH_TOKEN="$FALLBACK_TOKEN"
          fi
          version="${TAG#v}"
          node scripts/changelog.mjs "$version" installers/SHA256SUMS.txt > notes.md
          # Uma versão com sufixo (1.3.0-beta.1) nunca vira a mais recente, e por isso não chega aos aplicativos instalados.
          preview=""
          case "$version" in *-*) preview="--prerelease" ;; esac
          # Sem a tag, o gh cria uma neste commit; com a tag enviada à mão, usa a que existe.
          gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "Prancha $TAG" --notes-file notes.md $preview

      # Releases criadas por um workflow não disparam outros workflows: o site e a página são atualizados de forma explícita.
      - name: Atualiza o site e a página de downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
