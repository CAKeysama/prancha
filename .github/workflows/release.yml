name: Publicar versão

# Publica sozinho quando a versão do package.json muda na main, com a entrada no CHANGELOG.md: é o merge da versão nova.
# Uma tag vX.Y.Z enviada à mão também publica. Rodar à mão é um ensaio: compila e guarda os instaladores, sem publicar nada.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # Vale só para a main: o GitHub não avalia `paths` em tags.
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

# Uma fila por commit. O GitHub guarda uma só execução esperando em cada fila, e uma nova tira a anterior: com uma fila única,
# a tag de uma versão recém-publicada cancelou a 0.7.1, que esperava a vez. Por commit, merges seguidos publicam cada um a sua
# versão, ao mesmo tempo, sem um cancelar o outro. A tag que a publicação cria aponta para o mesmo commit: essa segunda execução
# espera a primeira terminar e só vê que a versão já foi publicada.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    name: Conferir a versão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        name: Decide se há versão nova para publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "::notice::Ensaio: os instaladores ficam como artefato da execução e nada é publicado."
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão do projeto ($tag)."
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::notice::A $tag já está publicada."
            else
              publish=true
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            # Este workflow só roda na main quando o package.json muda: com a tag já existente, dois PRs subiram para a mesma versão.
            echo "::error::A $tag já existe, então esta mudança não sai como versão nova. Abra um PR com \`npm run version:bump\` para publicar o que entrou."
            exit 1
          else
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  # Compila em paralelo com as verificações, que levam minutos: nada é publicado sem as duas passarem (ver `publish`).
  build:
    name: Gerar os instaladores
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Prepara o Rust
        run: rustup toolchain install stable --profile minimal

      # Guarda só as dependências compiladas em release, separadas das dos testes. O código do Prancha sempre é compilado do zero.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      # Sem o Client ID do MyAnimeList, a versão sairia com a integração escondida: confere antes de compilar.
      - name: Confere o Client ID do MyAnimeList
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
        run: |
          if ! printf '%s' "$MAL_CLIENT_ID" | grep -Eq '^[A-Za-z0-9]{16,64}$'; then
            echo "::error::A variável do repositório MAL_CLIENT_ID está vazia ou não tem o formato de um Client ID. Ver docs/MYANIMELIST.md."
            exit 1
          fi

      # Sem a chave, a compilação falha aqui: nenhuma versão sai sem assinatura. Ver docs/RELEASING.md.
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Identificador público do aplicativo no MyAnimeList (variável, não segredo). Sem ele, a integração não aparece.
          PRANCHA_MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}

      # O Client ID entra no executável na compilação: confere que ele está lá.
      - name: Confere o Client ID do MyAnimeList no executável
        if: vars.MAL_CLIENT_ID != ''
        shell: bash
        env:
          MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
        run: |
          if ! grep -qaF -- "$MAL_CLIENT_ID" target/release/prancha.exe; then
            echo "::error::O executável foi compilado sem o Client ID do MyAnimeList."
            exit 1
          fi
          echo "O executável traz o Client ID do MyAnimeList."

      - name: Reúne os instaladores, as assinaturas e os SHA-256
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir installers
          for file in "target/release/bundle/nsis/Prancha_${version}_x64-setup.exe" "target/release/bundle/msi/Prancha_${version}_x64_pt-BR.msi"; do
            cp "$file" "$file.sig" installers/
          done
          node scripts/updater-manifest.mjs "$version" installers
          cd installers
          for file in *.exe *.msi; do
            # Um instalador de verdade tem vários MB: menos que isso é build quebrado.
            if [ "$(stat -c %s "$file")" -lt 1000000 ]; then
              echo "::error::$file é pequeno demais."
              exit 1
            fi
          done
          sha256sum -b -- *.exe *.msi | sed 's/ \*/  /' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: instaladores
          path: installers
          if-no-files-found: error

  # O APK do Android, assinado com a chave do app. A chave fica nos segredos ANDROID_KEYSTORE_*, nunca no repositório, e
  # precisa ser sempre a mesma: o Android só instala uma atualização assinada pela chave do app já instalado. Sem ela, a
  # versão sai só com os instaladores do Windows, com um aviso. Ver docs/RELEASING.md.
  android:
    name: Gerar o APK do Android
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk: ${{ steps.key.outputs.ready }}
    steps:
      - id: key
        name: Confere a chave de assinatura do Android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Sem o segredo ANDROID_KEYSTORE_BASE64, esta versão sai sem o APK do Android. Ver docs/RELEASING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Prepara o Rust
        if: steps.key.outputs.ready == 'true'
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.ready == 'true'
        with:
          workspaces: . -> target
          shared-key: android-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci
        if: steps.key.outputs.ready == 'true'

      # Só ARM de 64 bits, a arquitetura dos celulares atuais. O mesmo Client ID do MyAnimeList do Windows.
      - name: Gera o APK assinado
        if: steps.key.outputs.ready == 'true'
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PRANCHA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PRANCHA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PRANCHA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PRANCHA_MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export PRANCHA_KEYSTORE="$RUNNER_TEMP/prancha.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$PRANCHA_KEYSTORE"
          npx tauri android build --apk --target aarch64 --ci
          rm -f "$PRANCHA_KEYSTORE"

      # O APK é conferido pelo Android (a chave do app) e pelo Prancha (a assinatura minisign, a mesma dos instaladores do
      # Windows, que declara a versão, e o SHA-256 do latest.json): ver crates/prancha-app/src/updates.rs.
      - name: Confere e assina o APK para o atualizador
        if: steps.key.outputs.ready == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(node -p "require('./package.json').version")"
          built=$(find apps/android/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          if [ -z "$built" ]; then
            echo "::error::O build não gerou o APK de release."
            exit 1
          fi
          mkdir android
          apk="$PWD/android/Prancha_${version}_android-arm64.apk"
          cp "$built" "$apk"
          if [ "$(stat -c %s "$apk")" -lt 1000000 ]; then
            echo "::error::$apk é pequeno demais."
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | grep -v '^WARNING'
          (cd apps/android && npx tauri signer sign --app-version "$version" "$apk")
          ls -l android

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.ready == 'true'
        with:
          name: apk
          path: android
          if-no-files-found: error

  publish:
    name: Publicar a release
    # Espera as verificações, os instaladores e o APK: se qualquer um falhar, nada sai.
    needs: [version, checks, build, android]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: instaladores
          path: installers

      - uses: actions/download-artifact@v8
        if: needs.android.outputs.apk == 'true'
        with:
          name: apk
          path: installers

      - name: Acrescenta o APK ao latest.json e aos SHA-256
        if: needs.android.outputs.apk == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          node scripts/updater-manifest.mjs "${TAG#v}" installers --android
          cd installers
          sha256sum -b -- *.apk | sed 's/ \*/  /' >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Cria a tag e a release com as notas do changelog
        env:
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          # Com o RELEASE_TOKEN, a release sai na conta dona do token. Sem ele, ou vencido, sai como github-actions[bot].
          export GH_TOKEN="$RELEASE_TOKEN"
          if [ -z "$GH_TOKEN" ] || ! gh api user --silent 2> /dev/null; then
            echo "::warning::Sem um RELEASE_TOKEN válido, a release sai como github-actions[bot]. Ver docs/RELEASING.md."
            export GH_TOKEN="$FALLBACK_TOKEN"
          fi
          version="${TAG#v}"
          node scripts/changelog.mjs "$version" installers/SHA256SUMS.txt > notes.md
          # Uma versão com sufixo (1.3.0-beta.1) nunca vira a mais recente, e por isso não chega aos aplicativos instalados.
          preview=""
          case "$version" in *-*) preview="--prerelease" ;; esac
          # Sem a tag, o gh cria uma neste commit; com a tag enviada à mão, usa a que existe. Quem vira a mais recente é decidido
          # depois, pela maior versão: publicações em paralelo podem terminar fora de ordem.
          gh release create "$TAG" installers/* --target "$GITHUB_SHA" --title "Prancha $TAG" --notes-file notes.md --latest=false $preview
          # Os aplicativos instalados procuram atualização na release marcada como a mais recente. Ela é sempre a maior versão
          # publicada, mesmo quando uma versão menor termina de publicar depois de uma maior.
          newest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ -n "$newest" ]; then
            gh release edit "$newest" --repo "$GITHUB_REPOSITORY" --latest
            echo "::notice::Mais recente: $newest."
          fi

      # Releases criadas por um workflow não disparam outros workflows: o site e a página são atualizados de forma explícita.
      - name: Atualiza o site e a página de downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
