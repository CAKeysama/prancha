name: Publicar versão

# A tag vX.Y.Z publica a versão. Rodar à mão é um ensaio: compila e guarda os instaladores, sem publicar nada.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Gerar os instaladores
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Confere a tag com a versão do projeto
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão do projeto ($expected)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Prepara o Rust
        run: rustup toolchain install stable --profile minimal

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-release-${{ runner.os }}-

      - run: npm ci

      # Sem a chave, a compilação falha aqui: nenhuma versão sai sem assinatura. Ver docs/RELEASING.md.
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Reúne os instaladores, as assinaturas e os SHA-256
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir installers
          for file in "src-tauri/target/release/bundle/nsis/Prancha_${version}_x64-setup.exe" "src-tauri/target/release/bundle/msi/Prancha_${version}_x64_pt-BR.msi"; do
            cp "$file" "$file.sig" installers/
          done
          node scripts/updater-manifest.mjs "$version" installers
          cd installers
          for file in *.exe *.msi; do
            # Um instalador de verdade tem vários MB: menos que isso é build quebrado.
            if [ "$(stat -c %s "$file")" -lt 1000000 ]; then
              echo "::error::$file é pequeno demais."
              exit 1
            fi
          done
          sha256sum -b -- *.exe *.msi | sed 's/ \*/  /' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: instaladores
          path: installers
          if-no-files-found: error

  publish:
    name: Publicar a release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: instaladores
          path: installers

      - name: Cria a release com as notas do changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelog.mjs "$version" installers/SHA256SUMS.txt > notes.md
          # Uma versão com sufixo (1.3.0-beta.1) nunca vira a mais recente, e por isso não chega aos aplicativos instalados.
          preview=""
          case "$version" in *-*) preview="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" installers/* --title "Prancha $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $preview

      # Releases criadas por um workflow não disparam outros workflows: a página é atualizada de forma explícita.
      - name: Atualiza a página de downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
