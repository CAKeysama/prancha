[package]
name = "prancha"
version = "0.7.0"
description = "Prancha — leitor e organizador de quadrinhos"
authors = ["Prancha"]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[lib]
name = "prancha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-notification = "2.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled", "collation"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
unrar = "0.5.8"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
tar = { version = "0.4.46", default-features = false }
lopdf = { version = "0.45.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
roxmltree = "0.21.1"
blake3 = "1.8.7"
trash = "5.2.9"
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
tauri-plugin-updater = "2.14.1"
semver = "1.0.28"
sha2 = "0.10.9"
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
wasmtime = { version = "48.0.8", default-features = false, features = ["cranelift", "runtime", "component-model", "std"] }
url = "2.5.8"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
base64 = "0.23.1"
getrandom = "0.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3.27.0"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd", "deflate", "compress"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tar = { version = "0.4.46", default-features = false }
wit-component = "0.263.0"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
wat = "1.263.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"
