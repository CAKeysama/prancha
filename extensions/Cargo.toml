# Fora do app: o SDK, a ferramenta de publicação e as extensões do projeto. As extensões compilam para WebAssembly.
[workspace]
resolver = "3"
members = ["sdk", "tools", "template", "test-fixture", "demo"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "1.0.0"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
