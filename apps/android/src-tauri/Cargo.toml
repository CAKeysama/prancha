[package]
name = "prancha-android"
description = "Prancha para Android"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "prancha_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
prancha-app = { path = "../../../crates/prancha-app" }
# Os plugins que o prancha-app usa. Ficam também aqui porque o Tauri só põe no APK o código Android (Kotlin)
# dos plugins que o próprio app declara: sem eles o app fecha ao abrir (ClassNotFoundException).
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
# O código gerado pelo `tauri::generate_context!` usa o serde_json pelo nome.
serde_json = "1.0.154"
